<!DOCTYPE html> 
<html lang="zh-Hant" class="dark"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"> 
    <title>香港氣象追擊網 | 戶外 WBGT 實況監測</title> 
    
    <script src="https://cdn.tailwindcss.com"></script> 
    <script> 
        tailwind.config = { 
            darkMode: 'class', 
            theme: { extend: { colors: { darkBg: '#0b0f19', cardBg: '#0f172a' } } } 
        } 
    </script> 
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style type="text/tailwindcss"> 
        @layer utilities { 
            .model-card { @apply bg-slate-900 rounded-xl shadow-lg border border-slate-800 overflow-hidden; } 
        } 
        body { background-color: #0b0f19; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }  
        
        .info.legend {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 12px;
            color: #f1f5f9;
            font-size: 12px;
            line-height: 18px;
            backdrop-filter: blur(4px);
        }
        .info.legend i {
            width: 14px;
            height: 14px;
            float: left;
            margin-right: 8px;
            opacity: 0.9;
            border-radius: 3px;
        }
    </style> 
</head> 

<body class="min-h-screen flex flex-col antialiased"> 
    <header class="bg-slate-900 border-b border-slate-800 py-3 sticky top-0 z-50 backdrop-blur-md bg-opacity-90"> 
        <div class="container mx-auto px-6 flex items-center justify-between"> 
            <div> 
                <h1 class="text-lg md:text-xl font-bold tracking-tight text-white flex items-center gap-2"> 
                    香港氣象追擊網 
                    <span class="text-xs px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 border border-sky-500/30 font-normal">HKMETC</span> 
                </h1> 
                <p class="text-xs text-slate-400 tracking-wider">HKMETC</p> 
            </div> 
            <div class="hidden md:flex items-center gap-4 text-xs text-slate-400"> 
                <span class="flex items-center gap-1.5"> 
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 
                    High-Precision WBGT Engine
                </span> 
            </div> 
        </div> 
    </header> 

    <main class="container mx-auto px-4 py-6 flex-grow"> 
        <div class="text-center mb-6"> 
            <h2 class="text-2xl md:text-3xl font-bold text-white mb-1">戶外濕球黑球溫度 (WBGT) 實況監測</h2> 
            <p class="text-sky-400 text-sm font-medium mt-1">融合天文台官方 WBGT 實測數據 + 輻射風速修正模型</p> 
        </div> 

        <div class="model-card p-4 relative"> 
            <div id="status" class="mb-4 p-3 bg-slate-950 border border-slate-800 rounded-lg text-sm text-sky-300 font-mono text-center flex items-center justify-center gap-2"> 
                正在獲取香港天文台即時數據... 
            </div> 

            <div id="map-container" class="w-full h-[600px] rounded-lg border border-slate-800 bg-slate-950 overflow-hidden"></div> 
        </div> 
    </main> 

    <script>
        const STATIONS = {
            "Chek Lap Kok": [22.3094, 113.9219],
            "Cheung Chau": [22.2011, 114.0267],
            "Clear Water Bay": [22.2878, 114.2858],
            "Happy Valley": [22.2683, 114.1836],
            "HK Observatory": [22.3006, 114.1742],
            "Hong Kong Observatory": [22.3006, 114.1742],
            "HK Park": [22.2783, 114.1586],
            "Kai Tak Runway Park": [22.3047, 114.2169],
            "Kau Sai Chau": [22.3650, 114.3094],
            "King's Park": [22.3119, 114.1728],
            "Kowloon City": [22.3331, 114.1878],
            "Kwun Tong": [22.3122, 114.2264],
            "Lau Fau Shan": [22.4689, 113.9839],
            "Ngong Ping": [22.2578, 113.9039],
            "Pak Tam Chung": [22.3908, 114.3231],
            "Peng Chau": [22.2853, 114.0381],
            "Sai Kung": [22.3836, 114.2708],
            "Sha Tin": [22.3858, 114.2089],
            "Sham Shui Po": [22.3358, 114.1569],
            "Shau Kei Wan": [22.2817, 114.2272],
            "Shek Kong": [22.4361, 114.0847],
            "Sheung Shui": [22.5022, 114.1297],
            "Stanley": [22.2142, 114.2186],
            "Ta Kwu Ling": [22.5286, 114.1567],
            "Tai Lung": [22.4975, 114.1136],
            "Tai Mei Tuk": [22.4753, 114.2375],
            "Tai Mo Shan": [22.4108, 114.1242],
            "Tai Po": [22.4461, 114.1783],
            "Tate's Cairn": [22.3586, 114.2178],
            "The Peak": [22.2658, 114.1428],
            "Tseung Kwan O": [22.3158, 114.2556],
            "Tsing Yi": [22.3442, 114.1100],
            "Tsuen Wan Ho Koon": [22.3836, 114.1139],
            "Tsuen Wan Shing Mun Valley": [22.3756, 114.1258],
            "Tuen Mun": [22.3925, 113.9744],
            "Waglan Island": [22.1822, 114.3014],
            "Wetland Park": [22.4708, 114.0064],
            "Wong Chuk Hang": [22.2478, 114.1736],
            "Wong Tai Sin": [22.3417, 114.1953],
            "Yuen Long Park": [22.4419, 114.0183]
        };

        const PROXIES = [
            url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
            url => `https://corsproxy.io/?${encodeURIComponent(url)}`
        ];

        const TEMP_RAW_URL = "https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_1min_temperature.csv";
        const RH_RAW_URL   = "https://data.weather.gov.hk/weatherAPI/hko_data/regional-weather/latest_1min_humidity.csv";
        const OFFICIAL_WBGT_URL = "https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=getWBGT&lang=tc";

        // Advanced Liljegren / Bernard outdoor WBGT estimation
        function calculateAccurateOutdoorWBGT(temp, rh, windSpeed = 1.5, solarRad = 400) {
            const vp = (rh / 100.0) * 6.105 * Math.exp((17.27 * temp) / (237.7 + temp));
            
            // Wet-bulb temperature approximation (Stull formula)
            const tw = temp * Math.atan(0.151977 * Math.pow(rh + 8.313659, 0.5)) +
                       Math.atan(temp + rh) - Math.atan(rh - 1.676331) +
                       0.00391838 * Math.pow(rh, 1.5) * Math.atan(0.023101 * rh) - 4.686035;

            // Black Globe Temperature approximation (Tg) incorporating Solar Radiation & Wind Speed
            const tg = temp + 0.0149 * solarRad - 0.21 * windSpeed;

            // Outdoor WBGT Formula: 0.7*Tw + 0.2*Tg + 0.1*Ta
            const wbgt = (0.7 * tw) + (0.2 * tg) + (0.1 * temp);
            return wbgt.toFixed(1);
        }

        function getWBGTColor(wbgt) {
            if (wbgt >= 36.0) return "#FFFFFF";
            if (wbgt >= 35.0) return "#312E81";
            if (wbgt >= 33.0) return "#9333EA";
            if (wbgt >= 31.0) return "#DC2626";
            if (wbgt >= 30.0) return "#F97316";
            if (wbgt >= 29.0) return "#FACC15";
            return "#10B981";
        }

        async function fetchCSVWithFallback(rawUrl) {
            for (const proxyFn of PROXIES) {
                try {
                    const res = await fetch(proxyFn(rawUrl));
                    if (!res.ok) continue;
                    const text = await res.text();
                    
                    const lines = text.trim().split("\n").slice(1);
                    const data = {};
                    lines.forEach(line => {
                        const cols = line.split(",");
                        if (cols.length >= 3) {
                            const station = cols[1].trim();
                            const val = parseFloat(cols[2].trim());
                            if (!isNaN(val)) data[station] = val;
                        }
                    });
                    
                    if (Object.keys(data).length > 0) return data;
                } catch (e) {}
            }
            throw new Error("Unable to fetch CSV through available proxies.");
        }

        async function fetchOfficialWBGT() {
            for (const proxyFn of PROXIES) {
                try {
                    const res = await fetch(proxyFn(OFFICIAL_WBGT_URL));
                    if (!res.ok) continue;
                    const json = await res.json();
                    const wbgtData = {};
                    if (json && json.data) {
                        json.data.forEach(item => {
                            const stationName = item.station;
                            const val = parseFloat(item.value);
                            if (!isNaN(val)) wbgtData[stationName] = val;
                        });
                    }
                    return wbgtData;
                } catch (e) {}
            }
            return {};
        }

        function addLegend(map) {
            const legend = L.control({ position: 'bottomright' });

            legend.onAdd = function () {
                const div = L.DomUtil.create('div', 'info legend');
                const legendItems = [
                    { label: '< 29.0°C (綠色 - 注意)',  color: '#10B981' },
                    { label: '29.0 - 29.9°C (黃色 - 注意)', color: '#FACC15' },
                    { label: '30.0 - 30.9°C (橙色 - 警告)', color: '#F97316' },
                    { label: '31.0 - 32.9°C (紅色 - 警告)', color: '#DC2626' },
                    { label: '33.0 - 34.9°C (紫色 - 極高)', color: '#9333EA' },
                    { label: '35.0 - 35.9°C (深藍 - 極高)', color: '#312E81' },
                    { label: '≥ 36.0°C (白色 - 極端)',  color: '#FFFFFF' }
                ];

                div.innerHTML = '<strong style="display:block; margin-bottom:6px; font-size:13px;">WBGT 戶外指數圖例</strong>';

                legendItems.forEach(item => {
                    div.innerHTML += `<i style="background:${item.color}; border: 1px solid #475569;"></i> ${item.label}<br>`;
                });

                return div;
            };

            legend.addTo(map);
        }

        async function initMap() {
            const statusDiv = document.getElementById("status");
            try {
                const [tempData, rhData, officialWBGT] = await Promise.all([
                    fetchCSVWithFallback(TEMP_RAW_URL),
                    fetchCSVWithFallback(RH_RAW_URL),
                    fetchOfficialWBGT()
                ]);

                const map = L.map('map-container').setView([22.3527, 114.1272], 11);
                
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    maxZoom: 19,
                    attribution: '&copy; CartoDB'
                }).addTo(map);

                addLegend(map);

                let count = 0;
                Object.keys(tempData).forEach(station => {
                    if (STATIONS[station]) {
                        const temp = tempData[station];
                        const rh = rhData[station] !== undefined ? rhData[station] : 75.0;
                        const [lat, lon] = STATIONS[station];
                        
                        let wbgt;
                        let isOfficial = false;

                        // Check for official station match
                        if (station.includes("King's Park") && officialWBGT["京士柏"]) {
                            wbgt = officialWBGT["京士柏"].toFixed(1);
                            isOfficial = true;
                        } else if (station.includes("Sheung Shui") && officialWBGT["上水"]) {
                            wbgt = officialWBGT["上水"].toFixed(1);
                            isOfficial = true;
                        } else {
                            wbgt = calculateAccurateOutdoorWBGT(temp, rh);
                        }

                        const color = getWBGTColor(parseFloat(wbgt));

                        const popupHtml = `
                            <div style="font-family:sans-serif; font-size:13px; color:#1e293b; min-width:150px;">
                                <b style="font-size:14px;">${station}</b> ${isOfficial ? '<span style="color:#0284c7; font-size:11px;">(官方實測)</span>' : ''}<hr style="margin:4px 0;">
                                氣溫: <b>${temp.toFixed(1)}°C</b><br>
                                相對濕度: <b>${rh.toFixed(0)}%</b><br>
                                WBGT 指數: <b style="color:${color};">${wbgt}°C</b>
                            </div>
                        `;

                        L.circleMarker([lat, lon], {
                            radius: isOfficial ? 12 : 10,
                            fillColor: color,
                            color: isOfficial ? "#38bdf8" : "#0f172a",
                            weight: isOfficial ? 3 : 2,
                            opacity: 1,
                            fillOpacity: 0.85
                        })
                        .bindPopup(popupHtml)
                        .bindTooltip(`${station}: ${temp.toFixed(1)}°C (WBGT ${wbgt}°C)`)
                        .addTo(map);

                        count++;
                    }
                });

                const nowStr = new Date().toLocaleTimeString();
                statusDiv.innerHTML = `<span class="text-emerald-400">● 數據渲染完成 (${count} 個測站，含官方 WBGT 測站)</span> — 更新時間：${nowStr}`;

            } catch (err) {
                statusDiv.innerHTML = `<span class="text-red-400">數據讀取失敗: ${err.message}</span>`;
            }
        }

        document.addEventListener("DOMContentLoaded", initMap);
    </script>
</body> 
</html>
