<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAMMB RIPA Auto-Fetch Summary</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <style>
        body { font-family: sans-serif; background: #f8f9fa; padding: 20px; text-align: center; }
        #status-box { font-weight: bold; background: #eef2f5; padding: 8px; border-radius: 4px; margin-bottom: 15px; }
        #plot-container { display: flex; justify-content: center; }
    </style>

    <py-config>
        packages = ["pandas", "matplotlib"]
    </py-config>
</head>
<body>

    <h1>RAMMB RIPA Diagnostic Summary</h1>
    <div id="status-box">Status: Loading latest live data...</div>
    <div id="plot-container"></div>

    <script type="py">
        import re
        import pandas as pd
        import matplotlib.pyplot as plt
        from matplotlib.lines import Line2D
        from pyodide.http import pyfetch
        from pyscript import display, document

        def set_status(msg):
            document.getElementById("status-box").innerText = f"Status: {msg}"

        async def main():
            try:
                # 1. Fetch live updated data from relative path (No CORS issue!)
                set_status("Fetching latest product data from repository...")
                resp_txt = await pyfetch("./data/latest_ripa.txt")
                if not resp_txt.ok:
                    raise Exception("File not found yet.")
                raw_text = await resp_txt.string()

                # 2. Fetch filename
                resp_name = await pyfetch("./data/latest_filename.txt")
                filename = await resp_name.string() if resp_name.ok else "latest_ripa.txt"
                filename = filename.strip()

                # --- PARSING ---
                lines = raw_text.splitlines()
                
                # Parse RI Probabilities
                ri_probs = []
                for line in lines:
                    line_str = line.strip()
                    if not line_str: continue
                    thresh_match = re.search(r'\b(RI\s*\d+|\d+\s*kt(?:\s*/\s*\d+\s*hr)?|RI\s*Prob\w*)\b', line_str, re.IGNORECASE)
                    if thresh_match:
                        numbers = re.findall(r'(\d+(?:\.\d+)?)\s*%?', line_str[thresh_match.end():])
                        if numbers:
                            val = float(numbers[-1])
                            if 0.0 < val <= 1.0: val *= 100.0
                            ri_probs.append({'Threshold': thresh_match.group(1).strip(), 'Probability': val})

                df_ri = pd.DataFrame(ri_probs).drop_duplicates(subset=['Threshold']) if ri_probs else pd.DataFrame()

                # Parse Predictors
                hours = [6, 12, 18, 24, 36, 48, 60, 72]
                cond_data = []
                for line in lines:
                    line_str = line.strip()
                    ratings = re.findall(r'\b[FNU]\b', line_str)
                    if len(ratings) == 8:
                        num_matches = list(re.finditer(r'[-+]?\d*\.\d+|\d+', line_str))
                        if len(num_matches) >= 8:
                            val_matches = num_matches[-8:]
                            vals = [float(m.group()) for m in val_matches]
                            predictor_name = re.sub(r'\s+', ' ', line_str[:val_matches[0].start()].strip())
                            for hr, val, rating in zip(hours, vals, ratings):
                                cond_data.append({'ForecastHour': hr, 'Predictor': predictor_name, 'Value': val, 'Rating': rating})

                df_cond = pd.DataFrame(cond_data)

                # --- PLOTTING ---
                color_map = {'F': '#2ca02c', 'N': '#7f7f7f', 'U': '#d62728'}
                predictors = df_cond['Predictor'].unique() if not df_cond.empty else []

                fig = plt.figure(figsize=(16, 10))
                gs = fig.add_gridspec(3, 4, hspace=0.38, wspace=0.35)

                # Left side: RI Probabilities
                ax_prob = fig.add_subplot(gs[:, 0:2])
                if not df_ri.empty:
                    bars = ax_prob.bar(df_ri['Threshold'], df_ri['Probability'], color='#1f77b4', width=0.45, edgecolor='black', alpha=0.85)
                    ax_prob.set_ylabel("Probability (%)", fontweight='bold', fontsize=11)
                    ax_prob.set_title("Rapid Intensification (RI) Probabilities", fontsize=12, fontweight='bold', pad=12)
                    ax_prob.set_ylim(0, 110)
                    ax_prob.grid(True, axis='y', linestyle=':', alpha=0.6)
                    for bar in bars:
                        yval = bar.get_height()
                        ax_prob.text(bar.get_x() + bar.get_width()/2.0, yval + 2, f"{int(yval)}%", ha='center', va='bottom', fontweight='bold')

                # Right side: Predictors
                for i, pred in enumerate(predictors[:6]):
                    row, col = i // 2, 2 + (i % 2)
                    ax = fig.add_subplot(gs[row, col])
                    sub = df_cond[df_cond['Predictor'] == pred].sort_values('ForecastHour')
                    ax.plot(sub['ForecastHour'], sub['Value'], color='#555555', linestyle='--', alpha=0.7)
                    for _, r in sub.iterrows():
                        c = color_map.get(r['Rating'], 'blue')
                        ax.scatter(r['ForecastHour'], r['Value'], color=c, s=55)
                        ax.annotate(r['Rating'], (r['ForecastHour'], r['Value']), textcoords="offset points", xytext=(0, 6), ha='center', fontsize=8, fontweight='bold', color=c)
                    ax.set_title(pred, fontsize=10, fontweight='bold')
                    ax.grid(True, linestyle=':', alpha=0.6)

                fig.suptitle(f"RAMMB RIPA Summary — {filename}", fontsize=14, fontweight='bold', y=0.98)
                set_status(f"Rendered latest product: {filename}")
                display(fig, target="plot-container")

            except Exception as e:
                set_status(f"Error: {str(e)}")

        import asyncio
        asyncio.ensure_future(main())
    </script>
</body>
</html>
