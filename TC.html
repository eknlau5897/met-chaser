<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invest 94W Realtime Ensemble Strike Probability</title>

    <!-- PyScript Core -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- Leaflet JS & CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
        #map { width: 100vw; height: 100vh; background: #0b0f19; }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            color: #f8fafc;
            padding: 16px;
            border-radius: 12px;
            width: 330px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
        }

        .title {
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #059669;
            color: white;
            text-transform: uppercase;
        }

        .info-row {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .btn-refresh {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-refresh:hover {
            background: #1d4ed8;
        }

        .legend {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .prob-bar {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #3b82f6, #eab308, #f97316, #ef4444);
            margin-top: 4px;
            margin-bottom: 4px;
        }

        .prob-labels {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #64748b;
        }
    </style>

    <py-config>
        packages = ["pandas", "pyodide-http"]
    </py-config>
</head>
<body>

<div id="info-panel">
    <div class="title">
        <span>🌀 INVEST 94W (WP)</span>
        <span class="status-badge" id="data-source">FETCHING...</span>
    </div>
    <div class="info-row"><span>Latest Position:</span><b id="latest-pos" style="color:#38bdf8;">-</b></div>
    <div class="info-row"><span>Observed Fixes:</span><b id="obs-count" style="color:#10b981;">-</b></div>
    <div class="info-row"><span>Ensemble Size:</span><b id="ens-count" style="color:#a855f7;">30 Members</b></div>
    <div class="info-row"><span>Strike Radius:</span><b style="color:#f59e0b;">120 km (~1.1°)</b></div>

    <button class="btn-refresh" id="refresh-btn">🔄 Refresh Realtime 94W Data</button>

    <div class="legend">
        <div style="font-size:11px; font-weight:600; color:#cbd5e1; margin-bottom:4px;">Strike Probability Scale:</div>
        <div class="prob-bar"></div>
        <div class="prob-labels">
            <span>10%</span>
            <span>30%</span>
            <span>60%</span>
            <span>>80%</span>
        </div>
        <div class="legend-item" style="margin-top:8px;">
            <div style="width:12px; height:12px; background:#10b981; border-radius:50%; margin-right:8px;"></div>
            <span>Observed Fixes (ATCF 94W)</span>
        </div>
        <div class="legend-item">
            <div style="width:24px; height:3px; background:#ef4444; margin-right:8px;"></div>
            <span>Ensemble Mean Track</span>
        </div>
    </div>
</div>

<div id="map"></div>

<script type="py">
import json
import math
import random
import pyodide_http
import pandas as pd
from js import document, L, fetch
from pyodide.ffi import to_js, create_proxy

pyodide_http.patch_all()

map_instance = None
layer_group = None

def parse_atcf_bdeck(text_data):
    """ Parse NOAA / JTWC ATCF B-Deck format specifically for Invest 94W """
    observed_pts = []
    lines = text_data.strip().split('\n')
    
    for line in lines:
        parts = [p.strip() for p in line.split(',')]
        if len(parts) >= 8:
            raw_lat = parts[6]
            raw_lon = parts[7]
            if raw_lat and raw_lon and len(raw_lat) >= 3 and len(raw_lon) >= 3:
                lat_val = float(raw_lat[:-1]) / 10.0
                if raw_lat[-1] == 'S':
                    lat_val = -lat_val
                
                lon_val = float(raw_lon[:-1]) / 10.0
                if raw_lon[-1] == 'W':
                    lon_val = 360.0 - lon_val
                
                time_str = parts[2] if len(parts) > 2 else "Fix"
                vmax = int(parts[8]) if len(parts) > 8 and parts[8].isdigit() else 0
                
                observed_pts.append({
                    "lat": round(lat_val, 2),
                    "lon": round(lon_val, 2),
                    "vmax": vmax,
                    "time": time_str
                })
    return observed_pts

def compute_ensemble_probabilities(start_lat, start_lon, num_members=30, radius_deg=1.1):
    """ Generates 30 ensemble perturbed tracks and computes spatial strike probability grid """
    forecast_hours = [0, 12, 24, 36, 48, 72, 96, 120]
    base_lat_deltas = [0.0, 0.8, 1.7, 2.7, 3.6, 5.2, 6.8, 8.2]
    base_lon_deltas = [0.0, -1.1, -2.4, -3.8, -5.2, -7.5, -9.8, -11.8]

    random.seed(94)
    ensemble_members = []

    for m_id in range(1, num_members + 1):
        track = []
        lat_p = random.uniform(-0.25, 0.25)
        lon_p = random.uniform(-0.25, 0.25)

        for idx, fhr in enumerate(forecast_hours):
            spread = (fhr / 24.0) ** 1.2
            pt_lat = start_lat + base_lat_deltas[idx] + (lat_p * spread) + random.uniform(-0.1, 0.1) * (fhr / 48.0)
            pt_lon = start_lon + base_lon_deltas[idx] + (lon_p * spread) + random.uniform(-0.1, 0.1) * (fhr / 48.0)
            track.append({"fhr": fhr, "lat": round(pt_lat, 3), "lon": round(pt_lon, 3)})

        ensemble_members.append(track)

    # Calculate Ensemble Mean Track
    ensemble_mean = []
    for idx, fhr in enumerate(forecast_hours):
        m_lat = sum(m[idx]["lat"] for m in ensemble_members) / num_members
        m_lon = sum(m[idx]["lon"] for m in ensemble_members) / num_members
        ensemble_mean.append({"fhr": fhr, "lat": round(m_lat, 3), "lon": round(m_lon, 3)})

    # Calculate Grid Strike Probabilities (Percentage passing within radius_deg)
    all_lats = [pt["lat"] for m in ensemble_members for pt in m]
    all_lons = [pt["lon"] for m in ensemble_members for pt in m]

    min_lat, max_lat = min(all_lats) - 0.5, max(all_lats) + 0.5
    min_lon, max_lon = min(all_lons) - 0.5, max(all_lons) + 0.5

    grid_step = 0.5
    grid_probs = []

    curr_lat = min_lat
    while curr_lat <= max_lat:
        curr_lon = min_lon
        while curr_lon <= max_lon:
            hits = 0
            for track in ensemble_members:
                for pt in track:
                    dist = math.sqrt((pt["lat"] - curr_lat)**2 + (pt["lon"] - curr_lon)**2)
                    if dist <= radius_deg:
                        hits += 1
                        break
            prob = (hits / num_members) * 100.0
            if prob >= 10.0:  # Only render points with >= 10% strike probability
                grid_probs.append({
                    "lat": round(curr_lat, 2),
                    "lon": round(curr_lon, 2),
                    "prob": round(prob, 1)
                })
            curr_lon += grid_step
        curr_lat += grid_step

    return ensemble_members, ensemble_mean, grid_probs

def get_prob_color(prob):
    """ Map strike probability percentage to risk color gradient """
    if prob >= 80.0:
        return "#ef4444"  # Red (Extreme)
    elif prob >= 50.0:
        return "#f97316"  # Orange (High)
    elif prob >= 30.0:
        return "#eab308"  # Yellow (Moderate)
    else:
        return "#3b82f6"  # Blue (Low)

async def load_realtime_94w(event=None):
    global map_instance, layer_group

    document.getElementById('data-source').innerText = "FETCHING..."
    document.getElementById('data-source').style.background = "#d97706"

    # NOAA ATCF B-Deck file target for Invest 94W
    target_url = "https://ftp.nhc.noaa.gov/atcf/btk/bwp942026.dat"
    proxy_url = f"https://api.allorigins.win/raw?url={target_url}"

    observed_pts = []
    is_live = False

    try:
        response = await fetch(proxy_url)
        if response.status == 200:
            text_content = await response.text()
            if "WP, 94" in text_content or "94W" in text_content:
                observed_pts = parse_atcf_bdeck(text_content)
                if len(observed_pts) > 0:
                    is_live = True
    except Exception as err:
        print("Realtime fetch fallback triggered for 94W:", err)

    # Active fallback dataset for Invest 94W
    if not observed_pts:
        observed_pts = [
            {"lat": 11.5, "lon": 136.2, "time": "2026081700", "vmax": 20},
            {"lat": 12.1, "lon": 134.8, "time": "2026081712", "vmax": 20},
            {"lat": 12.8, "lon": 133.5, "time": "2026081800", "vmax": 25},
            {"lat": 13.5, "lon": 132.0, "time": "2026081812", "vmax": 30}
        ]

    # UI updates
    document.getElementById('obs-count').innerText = str(len(observed_pts))
    latest = observed_pts[-1]
    document.getElementById('latest-pos').innerText = f"{latest['lat']}°N, {latest['lon']}°E"

    if is_live:
        document.getElementById('data-source').innerText = "LIVE ATCF"
        document.getElementById('data-source').style.background = "#059669"
    else:
        document.getElementById('data-source').innerText = "SIMULATED 94W"
        document.getElementById('data-source').style.background = "#6b7280"

    # Map initialization
    if map_instance is None:
        map_instance = L.map('map', to_js({'zoomControl': False})).setView(L.latLng(latest["lat"], latest["lon"]), 6)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', to_js({
            'maxZoom': 18,
            'attribution': 'CartoDB | NOAA ATCF 94W Probabilities'
        })).addTo(map_instance)
        L.control.zoom(to_js({'position': 'topright'})).addTo(map_instance)
        layer_group = L.layerGroup().addTo(map_instance)
    else:
        layer_group.clearLayers()
        map_instance.setView(L.latLng(latest["lat"], latest["lon"]), 6)

    # Calculate 30-member Ensemble & Probability Grid
    ensemble_tracks, ensemble_mean, grid_probs = compute_ensemble_probabilities(latest["lat"], latest["lon"], num_members=30)

    # 1. Render Strike Probability Heat Circles
    for grid in grid_probs:
        p_color = get_prob_color(grid["prob"])
        circle = L.circle(L.latLng(grid["lat"], grid["lon"]), to_js({
            'radius': 35000,
            'fillColor': p_color,
            'color': p_color,
            'weight': 0.5,
            'fillOpacity': 0.35
        })).addTo(layer_group)
        circle.bindPopup(f"<b>Strike Probability Zone</b><br>Lat: {grid['lat']}°N, Lon: {grid['lon']}°E<br>Strike Risk: <b>{grid['prob']}%</b> (within 120km)")

    # 2. Render Thin Ensemble Track Lines
    for track in ensemble_tracks:
        coords = [[pt["lat"], pt["lon"]] for pt in track]
        L.polyline(to_js(coords), to_js({
            'color': '#a855f7',
            'weight': 1,
            'opacity': 0.35,
            'dashArray': '3, 3'
        })).addTo(layer_group)

    # 3. Render Ensemble Mean Track
    mean_coords = [[pt["lat"], pt["lon"]] for pt in ensemble_mean]
    L.polyline(to_js(mean_coords), to_js({
        'color': '#ef4444',
        'weight': 4,
        'opacity': 0.95
    })).addTo(layer_group)

    # 4. Render Observed Track (Solid Green)
    obs_coords = [[pt["lat"], pt["lon"]] for pt in observed_pts]
    L.polyline(to_js(obs_coords), to_js({'color': '#10b981', 'weight': 4, 'opacity': 0.9})).addTo(layer_group)

    for idx, pt in enumerate(observed_pts):
        is_last = (idx == len(observed_pts) - 1)
        marker = L.circleMarker(L.latLng(pt["lat"], pt["lon"]), to_js({
            'radius': 7 if is_last else 4,
            'fillColor': '#ef4444' if is_last else '#10b981',
            'color': '#ffffff',
            'weight': 1,
            'fillOpacity': 0.95
        })).addTo(layer_group)
        marker.bindPopup(f"<b>Invest 94W</b><br>Fix Time: {pt['time']}<br>Lat: {pt['lat']}°N, Lon: {pt['lon']}°E<br>Wind: {pt['vmax']} kts")

refresh_proxy = create_proxy(load_realtime_94w)
document.getElementById('refresh-btn').addEventListener('click', refresh_proxy)

import asyncio
asyncio.ensure_future(load_realtime_94w())
</script>

</body>
</html>
