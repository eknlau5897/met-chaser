<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observed & Forecast Track Map</title>

    <!-- Leaflet JS & CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
        #map { width: 100vw; height: 100vh; background: #0b0f19; }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            color: #f8fafc;
            padding: 16px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
        }

        .title {
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
        }

        .info-row {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .legend {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .legend-line {
            width: 24px;
            height: 3px;
            margin-right: 8px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div id="info-panel">
    <div class="title" id="storm-title">🌀 TROPICAL SYSTEM TRACK</div>
    <div class="info-row"><span>Basin:</span><b style="color:#38bdf8;">North West Pacific</b></div>
    <div class="info-row"><span>Observed Waypoints:</span><b id="obs-count" style="color:#10b981;">0</b></div>
    <div class="info-row"><span>Forecast Waypoints:</span><b id="fcst-count" style="color:#38bdf8;">0</b></div>
    <div class="info-row"><span>Min Central Pressure:</span><b id="min-mslp" style="color:#ef4444;">-</b></div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-line" style="background: #10b981;"></div>
            <span>Observed / Past Track (Solid Line)</span>
        </div>
        <div class="legend-item">
            <div class="legend-line" style="border-top: 3px dashed #38bdf8;"></div>
            <span>Forecast Track (Dashed Line)</span>
        </div>
    </div>
</div>

<div id="map"></div>

<script>
    // =========================================================================
    // EDIT YOUR FIXED OBSERVED & FORECAST DATA HERE IN THE CODE
    // =========================================================================
    const stormName = "TYPHOON 70W";

    // Past / Observed Data (Historical track up to current time)
    const observedData = [
        { time: "2026-08-15 00Z", lat: 14.2, lon: 125.0, mslp: 1008.0 },
        { time: "2026-08-15 12Z", lat: 15.0, lon: 123.8, mslp: 1004.0 },
        { time: "2026-08-16 00Z", lat: 16.1, lon: 122.5, mslp: 1000.0 },
        { time: "2026-08-16 12Z", lat: 17.0, lon: 121.2, mslp: 996.0  },
        { time: "2026-08-17 00Z", lat: 18.0, lon: 120.0, mslp: 990.0  }  // Current position
    ];

    // Forecast Data (Projections moving forward)
    const forecastData = [
        { hour: 0,  lat: 18.0, lon: 120.0, mslp: 990.0 }, // Starts at current position
        { hour: 12, lat: 18.8, lon: 118.5, mslp: 985.0 },
        { hour: 24, lat: 19.6, lon: 117.1, mslp: 978.0 },
        { hour: 36, lat: 20.5, lon: 115.8, mslp: 970.0 },
        { hour: 48, lat: 21.3, lon: 114.5, mslp: 965.0 },
        { hour: 72, lat: 22.2, lon: 113.2, mslp: 960.0 }
    ];
    // =========================================================================

    // Update panel details
    document.getElementById('storm-title').innerText = "🌀 " + stormName;
    document.getElementById('obs-count').innerText = observedData.length;
    document.getElementById('fcst-count').innerText = forecastData.length;

    const allMslp = [...observedData.map(p => p.mslp), ...forecastData.map(p => p.mslp)];
    const minMslp = Math.min(...allMslp);
    document.getElementById('min-mslp').innerText = minMslp.toFixed(1) + " hPa";

    // Center map on the current position (last point of observed track)
    const currentPos = observedData[observedData.length - 1];
    const map = L.map('map', { zoomControl: false }).setView([currentPos.lat, currentPos.lon], 6);

    // Dark Map Base Tiles
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 18,
        attribution: 'CartoDB'
    }).addTo(map);

    L.control.zoom({ position: 'topright' }).addTo(map);

    // 1. PLOT OBSERVED TRACK (Solid Green Vector)
    const obsCoords = observedData.map(p => [p.lat, p.lon]);
    L.polyline(obsCoords, {
        color: '#10b981',
        weight: 4,
        opacity: 0.9
    }).addTo(map);

    // Plot Observed Markers
    observedData.forEach((point, index) => {
        const isCurrent = index === observedData.length - 1;

        const marker = L.circleMarker([point.lat, point.lon], {
            radius: isCurrent ? 8 : 5,
            fillColor: isCurrent ? '#ef4444' : '#10b981',
            color: '#ffffff',
            weight: isCurrent ? 2 : 1,
            fillOpacity: 1
        }).addTo(map);

        marker.bindPopup(`
            <div style="font-size:12px; font-family:sans-serif;">
                <b style="color:#10b981;">OBSERVED DATA</b><br>
                <b>${stormName}</b><br>
                Time: <b>${point.time}</b><br>
                Position: <b>${point.lat.toFixed(1)}°N, ${point.lon.toFixed(1)}°E</b><br>
                MSLP: <b>${point.mslp.toFixed(1)} hPa</b>
            </div>
        `);
    });

    // 2. PLOT FORECAST TRACK (Dashed Cyan Vector)
    const fcstCoords = forecastData.map(p => [p.lat, p.lon]);
    L.polyline(fcstCoords, {
        color: '#38bdf8',
        weight: 3,
        dashArray: '6, 6',
        opacity: 0.85
    }).addTo(map);

    // Plot Forecast Markers (skip index 0 since it overlaps with current position)
    forecastData.slice(1).forEach((point) => {
        const markerColor = point.mslp < 970 ? '#ef4444' : (point.mslp < 990 ? '#f59e0b' : '#38bdf8');

        const marker = L.circleMarker([point.lat, point.lon], {
            radius: 5,
            fillColor: markerColor,
            color: '#ffffff',
            weight: 1.5,
            fillOpacity: 0.9
        }).addTo(map);

        marker.bindPopup(`
            <div style="font-size:12px; font-family:sans-serif;">
                <b style="color:#38bdf8;">FORECAST DATA</b><br>
                <b>${stormName}</b><br>
                Lead Time: <b>+${point.hour}h</b><br>
                Position: <b>${point.lat.toFixed(1)}°N, ${point.lon.toFixed(1)}°E</b><br>
                MSLP: <b>${point.mslp.toFixed(1)} hPa</b>
            </div>
        `);
    });
</script>

</body>
</html>
