<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invest 95W Realtime & Ensemble Tracker</title>

    <!-- PyScript Core -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- Leaflet JS & CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
        #map { width: 100vw; height: 100vh; background: #0b0f19; }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            color: #f8fafc;
            padding: 16px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
        }

        .title {
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #059669;
            color: white;
            text-transform: uppercase;
        }

        .info-row {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .btn-refresh {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-refresh:hover {
            background: #1d4ed8;
        }

        .legend {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .legend-line {
            width: 24px;
            height: 3px;
            margin-right: 8px;
            border-radius: 2px;
        }
    </style>

    <py-config>
        packages = ["pandas", "pyodide-http"]
    </py-config>
</head>
<body>

<div id="info-panel">
    <div class="title">
        <span>🌀 INVEST 95W (WP)</span>
        <span class="status-badge" id="data-source">FETCHING...</span>
    </div>
    <div class="info-row"><span>Latest Position:</span><b id="latest-pos" style="color:#38bdf8;">-</b></div>
    <div class="info-row"><span>Observed Fixes:</span><b id="obs-count" style="color:#10b981;">-</b></div>
    <div class="info-row"><span>Ensemble Members:</span><b id="ens-count" style="color:#a855f7;">20 Tracks</b></div>

    <button class="btn-refresh" id="refresh-btn">🔄 Refresh Realtime 95W Data</button>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-line" style="background: #10b981;"></div>
            <span>Observed Track (Realtime B-Deck)</span>
        </div>
        <div class="legend-item">
            <div class="legend-line" style="background: #ef4444;"></div>
            <span>Ensemble Mean Track</span>
        </div>
        <div class="legend-item">
            <div class="legend-line" style="border-top: 2px dashed #a855f7;"></div>
            <span>Ensemble Perturbed Members</span>
        </div>
    </div>
</div>

<div id="map"></div>

<script type="py">
import json
import random
import pyodide_http
import pandas as pd
from js import document, L, fetch
from pyodide.ffi import to_js, create_proxy

pyodide_http.patch_all()

# Map Instance Global Reference
map_instance = None
layer_group = None

def parse_atcf_bdeck(text_data):
    """ Parse NOAA / JTWC ATCF B-Deck format for Invest 95W """
    observed_pts = []
    lines = text_data.strip().split('\n')
    
    for line in lines:
        parts = [p.strip() for p in line.split(',')]
        if len(parts) >= 8:
            raw_lat = parts[6]
            raw_lon = parts[7]
            if raw_lat and raw_lon and len(raw_lat) >= 3 and len(raw_lon) >= 3:
                # Lat conversion (e.g. 154N -> 15.4)
                lat_val = float(raw_lat[:-1]) / 10.0
                if raw_lat[-1] == 'S':
                    lat_val = -lat_val
                
                # Lon conversion (e.g. 1382E -> 138.2)
                lon_val = float(raw_lon[:-1]) / 10.0
                if raw_lon[-1] == 'W':
                    lon_val = 360.0 - lon_val
                
                time_str = parts[2] if len(parts) > 2 else "Fix"
                vmax = int(parts[8]) if len(parts) > 8 and parts[8].isdigit() else 0
                
                observed_pts.append({
                    "lat": round(lat_val, 2),
                    "lon": round(lon_val, 2),
                    "vmax": vmax,
                    "time": time_str
                })
    return observed_pts

def plot_ensemble(start_lat, start_lon, num_members=20):
    """ Generate and plot ensemble track members initialized from the latest 95W fix """
    forecast_hours = [0, 12, 24, 36, 48, 72, 96, 120]
    base_lat_deltas = [0.0, 0.7, 1.5, 2.4, 3.2, 4.6, 6.0, 7.3]
    base_lon_deltas = [0.0, -1.0, -2.2, -3.5, -4.8, -6.8, -8.5, -10.2]

    random.seed(95)
    ensemble_members = []

    for m_id in range(1, num_members + 1):
        track = []
        lat_perturb = random.uniform(-0.2, 0.2)
        lon_perturb = random.uniform(-0.2, 0.2)

        for idx, fhr in enumerate(forecast_hours):
            spread = (fhr / 24.0) ** 1.15
            pt_lat = start_lat + base_lat_deltas[idx] + (lat_perturb * spread) + random.uniform(-0.1, 0.1) * (fhr / 48.0)
            pt_lon = start_lon + base_lon_deltas[idx] + (lon_perturb * spread) + random.uniform(-0.1, 0.1) * (fhr / 48.0)
            track.append({"fhr": fhr, "lat": round(pt_lat, 3), "lon": round(pt_lon, 3)})

        ensemble_members.append({"member": m_id, "track": track})

    # Compute Ensemble Mean
    ensemble_mean = []
    for idx, fhr in enumerate(forecast_hours):
        mean_lat = sum(m["track"][idx]["lat"] for m in ensemble_members) / num_members
        mean_lon = sum(m["track"][idx]["lon"] for m in ensemble_members) / num_members
        ensemble_mean.append({"fhr": fhr, "lat": round(mean_lat, 3), "lon": round(mean_lon, 3)})

    return ensemble_members, ensemble_mean

async def load_realtime_95w(event=None):
    global map_instance, layer_group
    
    document.getElementById('data-source').innerText = "FETCHING..."
    document.getElementById('data-source').style.background = "#d97706"

    # NOAA ATCF B-Deck endpoint for 95W via CORS Proxy
    target_url = "https://ftp.nhc.noaa.gov/atcf/btk/bwp952026.dat"
    proxy_url = f"https://api.allorigins.win/raw?url={target_url}"
    
    observed_pts = []
    is_live = False

    try:
        response = await fetch(proxy_url)
        if response.status == 200:
            text_content = await response.text()
            if "WP, 95" in text_content or "95W" in text_content:
                observed_pts = parse_atcf_bdeck(text_content)
                if len(observed_pts) > 0:
                    is_live = True
    except Exception as err:
        print("Realtime fetch fallback triggered:", err)

    # Fallback dataset if 95W file is offline or not yet initialized in ATCF archive
    if not observed_pts:
        observed_pts = [
            {"lat": 13.5, "lon": 138.0, "time": "2026081700", "vmax": 20},
            {"lat": 14.2, "lon": 136.8, "time": "2026081712", "vmax": 25},
            {"lat": 15.0, "lon": 135.5, "time": "2026081800", "vmax": 25},
            {"lat": 15.8, "lon": 134.1, "time": "2026081812", "vmax": 30}
        ]

    # Update UI Panel
    document.getElementById('obs-count').innerText = str(len(observed_pts))
    latest = observed_pts[-1]
    document.getElementById('latest-pos').innerText = f"{latest['lat']}°N, {latest['lon']}°E"

    if is_live:
        document.getElementById('data-source').innerText = "LIVE ATCF"
        document.getElementById('data-source').style.background = "#059669"
    else:
        document.getElementById('data-source').innerText = "SIMULATED 95W"
        document.getElementById('data-source').style.background = "#6b7280"

    # Initialize or reset map layers
    if map_instance is None:
        map_instance = L.map('map', to_js({'zoomControl': False})).setView(L.latLng(latest["lat"], latest["lon"]), 6)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', to_js({
            'maxZoom': 18,
            'attribution': 'CartoDB | NOAA ATCF 95W'
        })).addTo(map_instance)
        L.control.zoom(to_js({'position': 'topright'})).addTo(map_instance)
        layer_group = L.layerGroup().addTo(map_instance)
    else:
        layer_group.clearLayers()
        map_instance.setView(L.latLng(latest["lat"], latest["lon"]), 6)

    # 1. Plot Observed Track (Solid Green Line)
    obs_coords = [[p["lat"], p["lon"]] for p in observed_pts]
    L.polyline(to_js(obs_coords), to_js({'color': '#10b981', 'weight': 4, 'opacity': 0.9})).addTo(layer_group)

    for idx, pt in enumerate(observed_pts):
        is_last = (idx == len(observed_pts) - 1)
        marker = L.circleMarker(L.latLng(pt["lat"], pt["lon"]), to_js({
            'radius': 7 if is_last else 4,
            'fillColor': '#ef4444' if is_last else '#10b981',
            'color': '#ffffff',
            'weight': 1,
            'fillOpacity': 0.95
        })).addTo(layer_group)
        marker.bindPopup(f"<b>Invest 95W</b><br>Fix Time: {pt['time']}<br>Lat: {pt['lat']}°N, Lon: {pt['lon']}°E<br>Wind: {pt['vmax']} kts")

    # 2. Run plot_ensemble starting from latest observed position
    members, mean_track = plot_ensemble(latest["lat"], latest["lon"], num_members=20)

    # Plot Member Tracks (Dashed Purple Lines)
    for m in members:
        m_coords = [[p["lat"], p["lon"]] for p in m["track"]]
        L.polyline(to_js(m_coords), to_js({
            'color': '#a855f7',
            'weight': 1.5,
            'opacity': 0.45,
            'dashArray': '4, 4'
        })).addTo(layer_group)

    # Plot Ensemble Mean Track (Solid Red Line)
    mean_coords = [[p["lat"], p["lon"]] for p in mean_track]
    L.polyline(to_js(mean_coords), to_js({
        'color': '#ef4444',
        'weight': 4,
        'opacity': 0.95
    })).addTo(layer_group)

    for pt in mean_track[1:]:
        marker = L.circleMarker(L.latLng(pt["lat"], pt["lon"]), to_js({
            'radius': 5,
            'fillColor': '#ef4444',
            'color': '#ffffff',
            'weight': 1,
            'fillOpacity': 0.9
        })).addTo(layer_group)
        marker.bindPopup(f"<b>95W Ensemble Mean</b><br>Lead Time: +{pt['fhr']}h<br>Lat: {pt['lat']}°N, Lon: {pt['lon']}°E")

# Bind Refresh Button Event
refresh_proxy = create_proxy(load_realtime_95w)
document.getElementById('refresh-btn').addEventListener('click', refresh_proxy)

# Initial Load
import asyncio
asyncio.ensure_future(load_realtime_95w())
</script>

</body>
</html>
