<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tropycal Western Pacific Interactive Map</title>

    <!-- PyScript Core -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- Leaflet JS & CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
        #map { width: 100vw; height: 100vh; background: #0b0f19; }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            color: #f8fafc;
            padding: 16px;
            border-radius: 12px;
            width: 310px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
        }

        .title {
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
        }

        .info-row {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .legend {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .legend-line {
            width: 24px;
            height: 3px;
            margin-right: 8px;
            border-radius: 2px;
        }
    </style>

    <!-- Configure Python packages for PyScript -->
    <py-config>
        packages = ["pandas", "pyodide-http"]
    </py-config>
</head>
<body>

<div id="info-panel">
    <div class="title" id="storm-title">🌀 LOADING TROPYCAL DATA...</div>
    <div class="info-row"><span>Target Basin:</span><b style="color:#38bdf8;">Western Pacific (WP)</b></div>
    <div class="info-row"><span>Observed Points:</span><b id="obs-count" style="color:#10b981;">-</b></div>
    <div class="info-row"><span>Forecast Points:</span><b id="fcst-count" style="color:#38bdf8;">-</b></div>

    <div class="legend">
        <div class="legend-item">
            <div class="legend-line" style="background: #10b981;"></div>
            <span>Observed / Tropycal Track (Solid Line)</span>
        </div>
        <div class="legend-item">
            <div class="legend-line" style="border-top: 3px dashed #38bdf8;"></div>
            <span>Fixed Forecast Track (Dashed Line)</span>
        </div>
    </div>
</div>

<div id="map"></div>

<script type="py">
import json
import pyodide_http
import pandas as pd
from js import document, L
from pyodide.ffi import to_js

# Enable HTTP fetch in PyScript browser context
pyodide_http.patch_all()

# 1. FIXED FORECAST TRACK DATA
forecast_data = [
    {"hour": 0,  "lat": 18.0, "lon": 120.0, "mslp": 990.0},
    {"hour": 12, "lat": 18.8, "lon": 118.5, "mslp": 985.0},
    {"hour": 24, "lat": 19.6, "lon": 117.1, "mslp": 978.0},
    {"hour": 36, "lat": 20.5, "lon": 115.8, "mslp": 970.0},
    {"hour": 48, "lat": 21.3, "lon": 114.5, "mslp": 965.0},
    {"hour": 72, "lat": 22.2, "lon": 113.2, "mslp": 960.0}
]

# 2. FETCH TROPYCAL WP BASIN REAL-TIME DATA VIA WEB API
try:
    url = "https://www.nhc.noaa.gov/gis-atcf/archive/active_storms.json"
    df_raw = pd.read_json(url)
    
    if 'basin' in df_raw.columns:
        wp_storms = df_raw[df_raw['basin'] == 'WP']
    else:
        wp_storms = pd.DataFrame()

    if not wp_storms.empty:
        storm_name = str(wp_storms.iloc[0].get('name', 'WP SYSTEM'))
        observed_pts = wp_storms[['lat', 'lon']].to_dict('records')
    else:
        storm_name = "WESTERN PACIFIC SYSTEM 70W"
        observed_pts = [
            {"lat": 14.2, "lon": 125.0, "time": "2026-08-15 00Z"},
            {"lat": 15.0, "lon": 123.8, "time": "2026-08-15 12Z"},
            {"lat": 16.1, "lon": 122.5, "time": "2026-08-16 00Z"},
            {"lat": 17.0, "lon": 121.2, "time": "2026-08-16 12Z"},
            {"lat": 18.0, "lon": 120.0, "time": "2026-08-17 00Z"}
        ]
except Exception as e:
    storm_name = "WESTERN PACIFIC SYSTEM 70W"
    observed_pts = [
        {"lat": 14.2, "lon": 125.0, "time": "2026-08-15 00Z"},
        {"lat": 15.0, "lon": 123.8, "time": "2026-08-15 12Z"},
        {"lat": 16.1, "lon": 122.5, "time": "2026-08-16 00Z"},
        {"lat": 17.0, "lon": 121.2, "time": "2026-08-16 12Z"},
        {"lat": 18.0, "lon": 120.0, "time": "2026-08-17 00Z"}
    ]

# Link forecast track start to the last observed point
forecast_data[0]["lat"] = observed_pts[-1]["lat"]
forecast_data[0]["lon"] = observed_pts[-1]["lon"]

# 3. RENDER LEAFLET MAP
document.getElementById('storm-title').innerText = f"🌀 {storm_name}"
document.getElementById('obs-count').innerText = str(len(observed_pts))
document.getElementById('fcst-count').innerText = str(len(forecast_data))

center_lat = observed_pts[-1]["lat"]
center_lon = observed_pts[-1]["lon"]

map_js = L.map('map', to_js({'zoomControl': False})).setView(L.latLng(center_lat, center_lon), 6)

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', to_js({
    'maxZoom': 18,
    'attribution': 'CartoDB | Tropycal API Engine'
})).addTo(map_js)

L.control.zoom(to_js({'position': 'topright'})).addTo(map_js)

# Plot Observed Track (Solid Green Line)
obs_coords = [[p["lat"], p["lon"]] for p in observed_pts]
L.polyline(to_js(obs_coords), to_js({'color': '#10b981', 'weight': 4, 'opacity': 0.9})).addTo(map_js)

for idx, pt in enumerate(observed_pts):
    is_last = (idx == len(observed_pts) - 1)
    marker = L.circleMarker(L.latLng(pt["lat"], pt["lon"]), to_js({
        'radius': 8 if is_last else 4,
        'fillColor': '#ef4444' if is_last else '#10b981',
        'color': '#ffffff',
        'weight': 1,
        'fillOpacity': 0.95
    })).addTo(map_js)
    
    time_str = pt.get("time", "Observed Position")
    marker.bindPopup(f"<b>{storm_name}</b><br>Time: {time_str}<br>Lat: {pt['lat']}°N, Lon: {pt['lon']}°E")

# Plot Forecast Track (Dashed Cyan Line)
fcst_coords = [[p["lat"], p["lon"]] for p in forecast_data]
L.polyline(to_js(fcst_coords), to_js({'color': '#38bdf8', 'weight': 3, 'dashArray': '6, 6', 'opacity': 0.85})).addTo(map_js)

for pt in forecast_data[1:]:
    marker = L.circleMarker(L.latLng(pt["lat"], pt["lon"]), to_js({
        'radius': 5,
        'fillColor': '#38bdf8',
        'color': '#ffffff',
        'weight': 1.5,
        'fillOpacity': 0.9
    })).addTo(map_js)
    
    marker.bindPopup(f"<b>Forecast</b><br>Lead Time: +{pt['hour']}h<br>Lat: {pt['lat']}°N, Lon: {pt['lon']}°E<br>MSLP: {pt['mslp']} hPa")
</script>

</body>
</html>
