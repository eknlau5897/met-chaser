<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Western Pacific Invest Tracker: 94W & 95W Ensemble Probabilities</title>

    <!-- PyScript Core -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- Leaflet JS & CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
        #map { width: 100vw; height: 100vh; background: #0b0f19; }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            color: #f8fafc;
            padding: 16px;
            border-radius: 12px;
            width: 330px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
        }

        .title {
            font-size: 14px;
            font-weight: 700;
            color: #38bdf8;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .system-select {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            cursor: pointer;
            outline: none;
        }

        .status-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #059669;
            color: white;
            text-transform: uppercase;
        }

        .info-row {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .btn-refresh {
            width: 100%;
            margin-top: 10px;
            padding: 8px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-refresh:hover {
            background: #1d4ed8;
        }

        .legend {
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .legend-item {
            display: flex;
            align-items: center;
            font-size: 11px;
            color: #94a3b8;
            margin-bottom: 4px;
        }

        .prob-bar {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #3b82f6, #eab308, #f97316, #ef4444);
            margin-top: 4px;
            margin-bottom: 4px;
        }

        .prob-labels {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #64748b;
        }
    </style>

    <py-config>
        packages = ["pandas", "pyodide-http"]
    </py-config>
</head>
<body>

<div id="info-panel">
    <div class="title">
        <span>🌀 WESTPAC TROPICAL INVESTS</span>
        <span class="status-badge" id="data-source">FETCHING...</span>
    </div>

    <label for="invest-selector" style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px;">Select Active Storm System:</label>
    <select id="invest-selector" class="system-select">
        <option value="94W" selected>Invest 94W (Western Pacific)</option>
        <option value="95W">Invest 95W (Western Pacific)</option>
    </select>

    <div class="info-row"><span>Latest Position:</span><b id="latest-pos" style="color:#38bdf8;">-</b></div>
    <div class="info-row"><span>Fix Timestamp:</span><b id="latest-time" style="color:#f59e0b;">-</b></div>
    <div class="info-row"><span>Observed Fixes:</span><b id="obs-count" style="color:#10b981;">-</b></div>
    <div class="info-row"><span>Ensemble Size:</span><b id="ens-count" style="color:#a855f7;">30 Members</b></div>

    <button class="btn-refresh" id="refresh-btn">🔄 Refresh Active System</button>

    <div class="legend">
        <div style="font-size:11px; font-weight:600; color:#cbd5e1; margin-bottom:4px;">Strike Probability Scale:</div>
        <div class="prob-bar"></div>
        <div class="prob-labels">
            <span>10%</span>
            <span>30%</span>
            <span>60%</span>
            <span>>80%</span>
        </div>
        <div class="legend-item" style="margin-top:8px;">
            <div style="width:12px; height:12px; background:#10b981; border-radius:50%; margin-right:8px;"></div>
            <span>Observed Fixes (ATCF Data)</span>
        </div>
        <div class="legend-item">
            <div style="width:24px; height:3px; background:#ef4444; margin-right:8px;"></div>
            <span>Ensemble Mean Track</span>
        </div>
    </div>
</div>

<div id="map"></div>

<script type="py">
import json
import math
import random
import pyodide_http
import pandas as pd
from js import document, L, fetch, JSON
from pyodide.ffi import create_proxy

pyodide_http.patch_all()

map_instance = None
layer_group = None

FALLBACK_DATA = {
    "94W": [
        {"lat": 11.5, "lon": 136.2, "time": "2026081700", "vmax": 20},
        {"lat": 12.1, "lon": 134.8, "time": "2026081712", "vmax": 20},
        {"lat": 12.8, "lon": 133.5, "time": "2026081800", "vmax": 25},
        {"lat": 13.5, "lon": 132.0, "time": "2026081812", "vmax": 30}
    ],
    "95W": [
        {"lat": 14.2, "lon": 146.5, "time": "2026081700", "vmax": 20},
        {"lat": 14.8, "lon": 145.1, "time": "2026081712", "vmax": 25},
        {"lat": 15.5, "lon": 143.8, "time": "2026081800", "vmax": 25},
        {"lat": 16.2, "lon": 142.5, "time": "2026081812", "vmax": 30}
    ]
}

# Palette of colors to give every ensemble member a distinct "spaghetti strand" color
SPAGHETTI_COLORS = [
    "#38bdf8", "#818cf8", "#c084fc", "#f472b6", "#fb7185",
    "#34d399", "#a3e635", "#facc15", "#fb923c", "#22d3ee"
]

def to_js_obj(py_data):
    return JSON.parse(json.dumps(py_data))

def parse_atcf_bdeck_robust(text_data):
    lines = text_data.strip().split('\n')
    fix_dict = {}

    for line in lines:
        parts = [p.strip() for p in line.split(',')]
        if len(parts) >= 8:
            time_str = parts[2] if len(parts) > 2 else ""
            tech = parts[4] if len(parts) > 4 else ""
            raw_lat = parts[6]
            raw_lon = parts[7]

            if raw_lat and raw_lon and len(raw_lat) >= 3 and len(raw_lon) >= 3:
                try:
                    lat_val = float(raw_lat[:-1]) / 10.0
                    if raw_lat[-1] == 'S':
                        lat_val = -lat_val

                    lon_val = float(raw_lon[:-1]) / 10.0
                    if raw_lon[-1] == 'W':
                        lon_val = -lon_val

                    vmax = int(parts[8]) if len(parts) > 8 and parts[8].isdigit() else 0

                    entry = {
                        "lat": round(lat_val, 2),
                        "lon": round(lon_val, 2),
                        "vmax": vmax,
                        "time": time_str,
                        "tech": tech
                    }

                    if time_str not in fix_dict or tech == 'BEST' or (tech == 'CARQ' and fix_dict[time_str]['tech'] != 'BEST'):
                        fix_dict[time_str] = entry

                except ValueError:
                    continue

    return sorted(fix_dict.values(), key=lambda x: x['time'])

def compute_spaghetti_ensemble(start_lat, start_lon, system_seed=94, num_members=40):
    forecast_hours = [0, 12, 24, 36, 48, 72, 96, 120]
    base_lat_deltas = [0.0, 0.8, 1.7, 2.7, 3.6, 5.2, 6.8, 8.2]
    base_lon_deltas = [0.0, -1.1, -2.4, -3.8, -5.2, -7.5, -9.8, -11.8]

    random.seed(system_seed)
    ensemble_members = []

    for m_id in range(1, num_members + 1):
        track = []
        lat_p = random.uniform(-0.4, 0.4)
        lon_p = random.uniform(-0.4, 0.4)

        for idx, fhr in enumerate(forecast_hours):
            spread = (fhr / 24.0) ** 1.3
            pt_lat = start_lat + base_lat_deltas[idx] + (lat_p * spread) + random.uniform(-0.15, 0.15) * (fhr / 36.0)
            pt_lon = start_lon + base_lon_deltas[idx] + (lon_p * spread) + random.uniform(-0.15, 0.15) * (fhr / 36.0)
            track.append({"fhr": fhr, "lat": round(pt_lat, 3), "lon": round(pt_lon, 3)})

        ensemble_members.append(track)

    ensemble_mean = []
    for idx, fhr in enumerate(forecast_hours):
        m_lat = sum(m[idx]["lat"] for m in ensemble_members) / num_members
        m_lon = sum(m[idx]["lon"] for m in ensemble_members) / num_members
        ensemble_mean.append({"fhr": fhr, "lat": round(m_lat, 3), "lon": round(m_lon, 3)})

    return ensemble_members, ensemble_mean

async def fetch_atcf_data(system_id):
    num = system_id[:-1]
    years = ["2026", "2025", "2024"]

    for yr in years:
        target_url = f"https://ftp.nhc.noaa.gov/atcf/btk/bwp{num}{yr}.dat"
        proxies = [
            f"https://corsproxy.io/?{target_url}",
            f"https://api.allorigins.win/raw?url={target_url}"
        ]

        for p_url in proxies:
            try:
                res = await fetch(p_url)
                if res.ok:
                    text = await res.text()
                    if f"WP, {num}" in text or system_id in text:
                        parsed = parse_atcf_bdeck_robust(text)
                        if parsed:
                            return parsed
            except Exception as e:
                continue
    return []

async def load_invest_data(event=None):
    global map_instance, layer_group

    system_id = document.getElementById('invest-selector').value
    seed = int(system_id[:-1])

    document.getElementById('data-source').innerText = "FETCHING..."
    document.getElementById('data-source').style.background = "#d97706"

    observed_pts = await fetch_atcf_data(system_id)
    is_live = len(observed_pts) > 0

    if not observed_pts:
        observed_pts = FALLBACK_DATA.get(system_id, FALLBACK_DATA["94W"])

    document.getElementById('obs-count').innerText = str(len(observed_pts))
    latest = observed_pts[-1]
    document.getElementById('latest-pos').innerText = f"{latest['lat']}°N, {latest['lon']}°E"
    document.getElementById('latest-time').innerText = str(latest.get('time', 'N/A'))

    if is_live:
        document.getElementById('data-source').innerText = "LIVE ATCF"
        document.getElementById('data-source').style.background = "#059669"
    else:
        document.getElementById('data-source').innerText = f"SIMULATED {system_id}"
        document.getElementById('data-source').style.background = "#6b7280"

    if map_instance is None:
        map_instance = L.map('map', to_js_obj({'zoomControl': False})).setView(L.latLng(latest["lat"], latest["lon"]), 6)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', to_js_obj({
            'maxZoom': 18,
            'attribution': 'CartoDB | NOAA ATCF Invest Tracker'
        })).addTo(map_instance)
        L.control.zoom(to_js_obj({'position': 'topright'})).addTo(map_instance)
        layer_group = L.layerGroup().addTo(map_instance)
    else:
        layer_group.clearLayers()
        map_instance.setView(L.latLng(latest["lat"], latest["lon"]), 6)

    ensemble_tracks, ensemble_mean = compute_spaghetti_ensemble(latest["lat"], latest["lon"], system_seed=seed, num_members=40)

    # 1. SPAGHETTI STRANDS (Individual Member Tracks)
    for idx, track in enumerate(ensemble_tracks):
        coords = to_js_obj([[pt["lat"], pt["lon"]] for pt in track])
        color = SPAGHETTI_COLORS[idx % len(SPAGHETTI_COLORS)]
        
        line = L.polyline(coords, to_js_obj({
            'color': color,
            'weight': 2,
            'opacity': 0.75
        })).addTo(layer_group)
        line.bindPopup(f"<b>Ensemble Member #{idx + 1}</b><br>Target: {track[-1]['lat']}°N, {track[-1]['lon']}°E")

    # 2. ENSEMBLE MEAN TRACK (Thick High-Contrast Black/White Line)
    mean_coords = to_js_obj([[pt["lat"], pt["lon"]] for pt in ensemble_mean])
    L.polyline(mean_coords, to_js_obj({
        'color': '#ffffff',
        'weight': 5,
        'opacity': 1.0
    })).addTo(layer_group)

    # 3. OBSERVED PAST TRACK (Solid Green Line)
    obs_coords = to_js_obj([[pt["lat"], pt["lon"]] for pt in observed_pts])
    L.polyline(obs_coords, to_js_obj({
        'color': '#10b981',
        'weight': 4,
        'opacity': 1.0
    })).addTo(layer_group)

    # 4. OBSERVED FIX MARKERS
    for idx, pt in enumerate(observed_pts):
        is_last = (idx == len(observed_pts) - 1)
        marker = L.circleMarker(L.latLng(pt["lat"], pt["lon"]), to_js_obj({
            'radius': 7 if is_last else 4,
            'fillColor': '#ef4444' if is_last else '#10b981',
            'color': '#ffffff',
            'weight': 1,
            'fillOpacity': 1.0
        })).addTo(layer_group)
        marker.bindPopup(f"<b>Invest {system_id} Fix</b><br>Time: {pt['time']}<br>Pos: {pt['lat']}°N, {pt['lon']}°E")

refresh_proxy = create_proxy(load_invest_data)
document.getElementById('refresh-btn').addEventListener('click', refresh_proxy)
document.getElementById('invest-selector').addEventListener('change', refresh_proxy)

import asyncio
asyncio.ensure_future(load_invest_data())
</script>

</body>
</html>
