<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyScript Tropycal Dashboard - Invest WP952026</title>

    <!-- PyScript Core -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- Leaflet JS & CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Heatmap Plugin -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
        #map { width: 100vw; height: 100vh; background: #0b0f19; }
        
        #control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            color: #f8fafc;
            padding: 18px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
        }
        
        .panel-title { 
            font-weight: 700; 
            font-size: 14px; 
            color: #38bdf8; 
            margin-bottom: 12px; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding-bottom: 6px; 
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .control-group { margin-bottom: 12px; }
        label { font-size: 12px; color: #94a3b8; font-weight: 600; display: block; margin-bottom: 4px; }
        
        select, input[type="range"] {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
        }

        .checkbox-label {
            font-size: 13px;
            color: #fff;
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-top: 8px;
        }
        .checkbox-label input { margin-right: 8px; accent-color: #38bdf8; width: 16px; height: 16px; }

        .legend {
            margin-top: 10px;
            background: rgba(30, 41, 59, 0.7);
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
        }
        .legend-bar {
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #0000ff, #00ffff, #00ff00, #ffff00, #ff0000);
            margin-top: 4px;
        }
        .legend-labels { display: flex; justify-content: space-between; margin-top: 2px; color: #94a3b8; }
    </style>

    <!-- PyScript Engine Configuration -->
    <py-config>
        packages = ["numpy", "scipy"]
    </py-config>
</head>
<body>

<div id="control-panel">
    <div class="panel-title">
        <span>🌀 TROPYCAL WP952026</span>
        <span style="font-size: 10px; background: #0284c7; padding: 2px 6px; border-radius: 4px;">ACTIVE WP</span>
    </div>

    <!-- Active System Identification -->
    <div class="control-group">
        <label for="stormSelect">SELECT WP SYSTEM:</label>
        <select id="stormSelect" py-change="update_dashboard">
            <option value="WP952026" selected>Invest WP952026 (16.6°N, 120.1°E)</option>
        </select>
    </div>

    <!-- Ensemble Model Options -->
    <div class="control-group" style="background: #1e293b; padding: 10px; border-radius: 6px; border: 1px solid #475569;">
        <label style="color:#38bdf8; margin-bottom: 6px;">ENSEMBLE MODEL:</label>
        <select id="modelSelect" py-change="update_dashboard">
            <option value="gefs" selected>GEFS (30 Members)</option>
            <option value="eceps">ECEPS (50 Members)</option>
            <option value="cmeps">CMEPS (20 Members)</option>
        </select>

        <label class="checkbox-label">
            <input type="checkbox" id="toggleHeatmap" checked py-change="update_dashboard">
            Strike Probability Heatmap (150 km Radius)
        </label>

        <label class="checkbox-label">
            <input type="checkbox" id="toggleSpaghetti" checked py-change="update_dashboard">
            Ensemble Member Tracks
        </label>

        <label class="checkbox-label">
            <input type="checkbox" id="toggleMean" checked py-change="update_dashboard">
            Ensemble Mean & Track Markers
        </label>
    </div>

    <!-- Strike Radius Calibration -->
    <div class="control-group">
        <label for="radiusKmInput">STRIKE PROBABILITY RADIUS (KM):</label>
        <input type="range" id="radiusKmInput" min="50" max="300" value="150" step="10" py-change="update_dashboard">
        <div style="text-align: right; font-size: 11px; color: #38bdf8; margin-top: 2px;" id="radiusDisplay">150 km</div>
    </div>

    <!-- Embedded Heatmap Color Legend -->
    <div class="legend">
        <span>Strike Probability Scale (within 150 km)</span>
        <div class="legend-bar"></div>
        <div class="legend-labels">
            <span>Low (10%)</span>
            <span>Moderate</span>
            <span>High Density (100%)</span>
        </div>
    </div>
</div>

<div id="map"></div>

<script type="py">
import numpy as np
from js import document, L, window
from pyodide.ffi import to_js

# WP952026 Track Dataset
storm_data = {
    "name": "Invest WP952026",
    "id": "WP952026",
    "lat": 16.6, "lon": 120.1,
    "observed": [[16.7, 120.0], [16.6, 120.2], [16.6, 120.1]],
    "forecast_mean": [[16.6, 120.1], [17.4, 119.2], [18.5, 118.0], [19.8, 116.5], [21.2, 114.8]],
    "seeds": {"gefs": 9520, "eceps": 7712, "cmeps": 3341},
    "counts": {"gefs": 30, "eceps": 50, "cmeps": 20}
}

# Generate Ensemble Track Coordinates using Python Math Engine
def compute_ensemble_coords(model="gefs"):
    seed = storm_data["seeds"][model]
    num_members = storm_data["counts"][model]
    np.random.seed(seed)
    
    mean_coords = np.array(storm_data["forecast_mean"])
    lons = mean_coords[:, 1]
    lats = mean_coords[:, 0]
    
    member_lons, member_lats = [], []
    
    for i in range(num_members):
        lon_noise = np.random.normal(0, 0.35, size=len(lons)).cumsum()
        lat_noise = np.random.normal(0, 0.35, size=len(lats)).cumsum()
        
        m_lon = lons + lon_noise + (i - num_members/2) * 0.08
        m_lat = lats + lat_noise
        
        member_lons.append(m_lon)
        member_lats.append(m_lat)

    return member_lons, member_lats

# Function to calculate pixel radius dynamically for a physical distance (km)
def get_pixel_radius(lat, radius_km, map_obj):
    meters_per_pixel = 156543.03392 * np.cos(np.radians(lat)) / (2 ** map_obj.getZoom())
    return (radius_km * 1000.0) / meters_per_pixel

# Initialize Native Leaflet Web Map
map_center = L.latLng(storm_data["lat"], storm_data["lon"])
map_js = L.map('map', to_js({'zoomControl': False})).setView(map_center, 6)

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    'maxZoom': 18,
    'attribution': 'CartoDB'
}).addTo(map_js)

L.control.zoom(to_js({'position': 'topright'})).addTo(map_js)

active_layers = []

# Main Update Callback Function
def update_dashboard(event=None):
    global active_layers
    
    # Extract DOM inputs
    model_choice = document.getElementById("modelSelect").value
    show_heatmap = document.getElementById("toggleHeatmap").checked
    show_spaghetti = document.getElementById("toggleSpaghetti").checked
    show_mean = document.getElementById("toggleMean").checked
    
    radius_km = float(document.getElementById("radiusKmInput").value)
    document.getElementById("radiusDisplay").innerText = f"{int(radius_km)} km"

    # Clear old Leaflet map layers
    for layer in active_layers:
        map_js.removeLayer(layer)
    active_layers.clear()

    # Calculate ensemble coordinates using Python backend
    m_lons, m_lats = compute_ensemble_coords(model=model_choice)

    # 1. Leaflet Heatmap Layer calibrated directly to 150 km Strike Distance
    if show_heatmap:
        pixel_radius = get_pixel_radius(storm_data["lat"], radius_km, map_js)
        heat_points = []
        for i in range(len(m_lons)):
            for j in range(len(m_lons[i])):
                weight = max(1.0 - (j * 0.15), 0.2)
                heat_points.append([m_lats[i][j], m_lons[i][j], weight])

        heat_layer = L.heatLayer(
            to_js(heat_points),
            to_js({
                'radius': pixel_radius,
                'blur': pixel_radius * 0.65,
                'maxZoom': 10,
                'gradient': {
                    0.2: '#0000ff',
                    0.4: '#00ffff',
                    0.6: '#00ff00',
                    0.8: '#ffff00',
                    1.0: '#ff0000'
                }
            })
        ).addTo(map_js)
        active_layers.append(heat_layer)

    # 2. Interactive Spaghetti Track Lines
    if show_spaghetti:
        for i in range(len(m_lons)):
            pts = [[m_lats[i][j], m_lons[i][j]] for j in range(len(m_lons[i]))]
            line = L.polyline(to_js(pts), to_js({'color': '#a855f7', 'weight': 1.2, 'opacity': 0.35})).addTo(map_js)
            active_layers.append(line)

    # 3. Track Vectors & Waypoint Markers
    if show_mean:
        obs_js = to_js([[c[0], c[1]] for c in storm_data["observed"]])
        obs_line = L.polyline(obs_js, to_js({'color': '#00f2fe', 'weight': 4, 'opacity': 0.9})).addTo(map_js)
        active_layers.append(obs_line)

        fct_js = to_js([[c[0], c[1]] for c in storm_data["forecast_mean"]])
        fct_line = L.polyline(fct_js, to_js({'color': '#f59e0b', 'weight': 4, 'dashArray': '8, 8'})).addTo(map_js)
        active_layers.append(fct_line)

        for idx, pt in enumerate(storm_data["forecast_mean"]):
            marker = L.circleMarker(L.latLng(pt[0], pt[1]), to_js({
                'radius': 7 if idx == 0 else 5,
                'fillColor': '#ef4444' if idx == 0 else '#f59e0b',
                'color': '#ffffff',
                'weight': 1.5,
                'fillOpacity': 0.9
            })).addTo(map_js)
            
            marker.bindPopup(f"""
                <div style="font-size:12px; font-family:sans-serif;">
                    <b>{storm_data['name']} ({model_choice.upper()})</b><br>
                    Forecast Lead: <b>+{idx * 12}h</b><br>
                    Lat: {pt[0]}°N, Lon: {pt[1]}°E
                </div>
            """)
            active_layers.append(marker)

    map_js.flyTo(map_center, 6)

# Handle dynamic re-scaling on zoom changes
map_js.on('zoomend', to_js(lambda e: update_dashboard()))

# Initial run
update_dashboard()
</script>

</body>
</html>
