<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyScript West Pacific Typhoon Dashboard</title>

    <!-- PyScript Core -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- Leaflet JS & CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
        #map { width: 100vw; height: 100vh; }
        
        #control-panel {
            position: absolute;
            top: 20px;
            left: 50px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            color: #f8fafc;
            padding: 18px;
            border-radius: 12px;
            width: 290px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        
        .panel-title { font-weight: 700; font-size: 14px; color: #38bdf8; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 6px; }
        .control-group { margin-bottom: 12px; }
        label { font-size: 12px; color: #94a3b8; font-weight: 600; display: block; margin-bottom: 4px; }
        
        select, input[type="number"] {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
        }

        .checkbox-label {
            font-size: 13px;
            color: #fff;
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-top: 6px;
        }
        .checkbox-label input { margin-right: 8px; accent-color: #38bdf8; }

        .popup-card { width: 330px; text-align: center; }
        .popup-card img { width: 100%; border-radius: 6px; margin-top: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    </style>

    <!-- Configure Pyodide Python Environment -->
    <py-config>
        packages = ["matplotlib", "numpy"]
    </py-config>
</head>
<body>

<div id="control-panel">
    <div class="panel-title">🌏 WEST PACIFIC TYPHOON VIEWER</div>

    <!-- West Pacific System Selector -->
    <div class="control-group">
        <label for="stormSelect">SELECT WP SYSTEM:</label>
        <select id="stormSelect" py-change="update_dashboard">
            <option value="WP902026">Typhoon Gaemi (WP032024)</option>
            <option value="WP102026">Typhoon Yagi (WP112024)</option>
            <option value="WP112026">Typhoon Kong-rey (WP232024)</option>
        </select>
    </div>

    <!-- Customized Forecast Track Toggle -->
    <div class="control-group">
        <label>CUSTOMIZED FORECAST TRACK:</label>
        <label class="checkbox-label">
            <input type="checkbox" id="showCustomTrack" checked py-change="update_dashboard"> Overlay Custom Track
        </label>
    </div>

    <!-- plot_ensemble Options -->
    <div class="control-group" style="background: #1e293b; padding: 10px; border-radius: 6px; border: 1px solid #475569;">
        <label style="color:#38bdf8;">plot_ensemble() OPTIONS:</label>
        
        <label for="modelSelect" style="margin-top:6px;">ENSEMBLE MODEL:</label>
        <select id="modelSelect" py-change="update_dashboard">
            <option value="gefs">GEFS (GFS Ensembles)</option>
            <option value="eceps">ECEPS (ECMWF Ensembles)</option>
            <option value="cmeps">CMEPS (CMC Ensembles)</option>
        </select>

        <label for="memberCount" style="margin-top:8px;">MEMBER COUNT:</label>
        <input type="number" id="memberCount" value="25" min="5" max="50" step="5" py-change="update_dashboard">

        <label class="checkbox-label">
            <input type="checkbox" id="showMean" checked py-change="update_dashboard"> Highlight Ensemble Mean
        </label>
    </div>
</div>

<div id="map"></div>

<!-- Python Logic Running Live via WebAssembly -->
<script type="py">
import base64
from io import BytesIO
import matplotlib.pyplot as plt
import numpy as np
from js import document, L
from pyodide.ffi import to_js

# West Pacific Systems Database (Lat, Lon)
storms_db = {
    "WP902026": {
        "name": "Typhoon Gaemi",
        "id": "WP032024",
        "lat": 24.0, "lon": 121.7,
        "observed_coords": [[16.2, 126.1], [18.1, 125.4], [20.5, 124.8], [24.0, 121.7]],
        "custom_forecast_coords": [[24.0, 121.7], [25.5, 119.5], [27.1, 118.2], [29.0, 117.0]]
    },
    "WP102026": {
        "name": "Typhoon Yagi",
        "id": "WP112024",
        "lat": 19.2, "lon": 112.5,
        "observed_coords": [[14.1, 123.8], [16.5, 120.2], [18.4, 116.1], [19.2, 112.5]],
        "custom_forecast_coords": [[19.2, 112.5], [20.1, 110.2], [21.0, 107.5], [21.5, 104.8]]
    },
    "WP112026": {
        "name": "Typhoon Kong-rey",
        "id": "WP232024",
        "lat": 22.8, "lon": 121.3,
        "observed_coords": [[16.8, 131.0], [18.5, 128.2], [20.4, 124.5], [22.8, 121.3]],
        "custom_forecast_coords": [[22.8, 121.3], [25.0, 122.5], [28.2, 124.0], [31.5, 127.8]]
    }
}

# Emulate Tropycal's plot_ensembles() function in-browser
def plot_ensembles(storm, model="gefs", num_members=25, show_mean=True):
    fig, ax = plt.subplots(figsize=(5.5, 4.0))
    
    # Deterministic seed per storm and member combination
    seed = sum(ord(c) for c in storm['name']) + num_members
    np.random.seed(seed)
    
    x = np.linspace(0, 12, 60)
    base_track = np.sin(x * 0.35)
    
    # Render individual ensemble lines
    member_tracks = []
    for i in range(num_members):
        noise = np.random.normal(0, 0.12, size=len(x)).cumsum()
        member_line = base_track + noise + (i - num_members/2) * 0.07
        member_tracks.append(member_line)
        ax.plot(x, member_line, color='#8b5cf6', alpha=0.35, linewidth=0.9)

    # Highlight Ensemble Mean
    if show_mean:
        mean_track = np.mean(member_tracks, axis=0)
        ax.plot(x, mean_track, color='#10b981', linewidth=2.5, label='Ensemble Mean')

    ax.set_title(f"{storm['name']} ({storm['id']}) - {model.upper()} Ensembles ({num_members} Members)", 
                 fontsize=9, fontweight='bold', color='#1e293b')
    ax.grid(True, linestyle='--', alpha=0.4)
    if show_mean:
        ax.legend(loc='upper left', fontsize=8)

    # Save Matplotlib plot as Base64 string
    buf = BytesIO()
    plt.savefig(buf, format='png', bbox_inches='tight', dpi=110)
    buf.seek(0)
    img_b64 = base64.b64encode(buf.read()).decode('utf-8')
    plt.close(fig)
    return f"data:image/png;base64,{img_b64}"

# Initialize Leaflet Map centered over Taiwan/Luzon Strait (West Pacific)
first_storm = storms_db["WP902026"]
map_center = L.latLng(first_storm["lat"], first_storm["lon"])
map_js = L.map('map').setView(map_center, 6)

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    'maxZoom': 19,
    'attribution': 'CartoDB'
}).addTo(map_js)

active_layers = []

# Main dynamic update function called on UI changes
def update_dashboard(event=None):
    global active_layers
    
    # Parse UI controls
    storm_key = document.getElementById("stormSelect").value
    show_custom_track = document.getElementById("showCustomTrack").checked
    model_choice = document.getElementById("modelSelect").value
    member_cnt = int(document.getElementById("memberCount").value)
    show_mean_flag = document.getElementById("showMean").checked
    
    storm = storms_db[storm_key]

    # Clear prior layers
    for layer in active_layers:
        map_js.removeLayer(layer)
    active_layers.clear()

    # Draw Observed Track Line
    obs_coords_js = to_js([[c[0], c[1]] for c in storm["observed_coords"]])
    obs_polyline = L.polyline(obs_coords_js, to_js({'color': '#00f2fe', 'weight': 4, 'opacity': 0.9})).addTo(map_js)
    active_layers.append(obs_polyline)

    # Draw Customized Forecast Track Line
    if show_custom_track:
        fct_coords_js = to_js([[c[0], c[1]] for c in storm["custom_forecast_coords"]])
        fct_polyline = L.polyline(fct_coords_js, to_js({'color': '#f59e0b', 'weight': 3, 'dashArray': '6, 8'})).addTo(map_js)
        active_layers.append(fct_polyline)

    # Render plot_ensembles() image
    plot_b64 = plot_ensembles(
        storm, 
        model=model_choice, 
        num_members=member_cnt, 
        show_mean=show_mean_flag
    )

    # Build Interactive Popup
    popup_html = f"""
    <div class="popup-card">
        <h4 style="margin:0; color:#0f172a;">{storm['name']} ({storm['id']})</h4>
        <img src="{plot_b64}">
    </div>
    """

    marker_pos = L.latLng(storm["lat"], storm["lon"])
    marker = L.marker(marker_pos).addTo(map_js)
    marker.bindPopup(popup_html, to_js({'maxWidth': 350}))
    active_layers.append(marker)

    # Pan Map to System Location
    map_js.flyTo(marker_pos, 6)

# Initial execution
update_dashboard()
</script>

</body>
</html>
