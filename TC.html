<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyScript Tropycal Dashboard - Invest 95W</title>

    <!-- PyScript Core -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- Leaflet JS & CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet Heatmap Plugin -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
        #map { width: 100vw; height: 100vh; background: #0b0f19; }
        
        #control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            color: #f8fafc;
            padding: 18px;
            border-radius: 12px;
            width: 330px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
        }
        
        .panel-title { 
            font-weight: 700; 
            font-size: 14px; 
            color: #38bdf8; 
            margin-bottom: 12px; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding-bottom: 6px; 
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .control-group { margin-bottom: 12px; }
        label { font-size: 12px; color: #94a3b8; font-weight: 600; display: block; margin-bottom: 4px; }
        
        select {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
        }

        .checkbox-label {
            font-size: 13px;
            color: #fff;
            display: flex;
            align-items: center;
            cursor: pointer;
            margin-top: 8px;
        }
        .checkbox-label input { margin-right: 8px; accent-color: #38bdf8; width: 16px; height: 16px; }

        .legend {
            margin-top: 10px;
            background: rgba(30, 41, 59, 0.7);
            padding: 8px;
            border-radius: 6px;
            font-size: 11px;
        }
        .legend-bar {
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #0000ff, #00ffff, #00ff00, #ffff00, #ff0000);
            margin-top: 4px;
        }
        .legend-labels { display: flex; justify-content: space-between; margin-top: 2px; color: #94a3b8; }
    </style>

    <!-- PyScript Engine Configuration -->
    <py-config>
        packages = ["numpy", "scipy"]
    </py-config>
</head>
<body>

<div id="control-panel">
    <div class="panel-title">
        <span>🌀 TROPYCAL REAL-TIME 95W</span>
        <span style="font-size: 10px; background: #0284c7; padding: 2px 6px; border-radius: 4px;">LIVE FIX</span>
    </div>

    <!-- System Info -->
    <div class="control-group">
        <label for="stormSelect">SELECT SYSTEM:</label>
        <select id="stormSelect" py-change="update_dashboard">
            <option value="95W" selected>Invest 95W (South China Sea / WNP)</option>
        </select>
    </div>

    <!-- Ensemble Controls -->
    <div class="control-group" style="background: #1e293b; padding: 10px; border-radius: 6px; border: 1px solid #475569;">
        <label style="color:#38bdf8; margin-bottom: 6px;">ENSEMBLE MODEL:</label>
        <select id="modelSelect" py-change="update_dashboard">
            <option value="gefs" selected>GEFS (30 Members)</option>
            <option value="eceps">ECEPS (50 Members)</option>
            <option value="cmeps">CMEPS (20 Members)</option>
        </select>

        <label class="checkbox-label">
            <input type="checkbox" id="toggleHeatmap" checked py-change="update_dashboard">
            Strike Probability Heatmap (KDE × 100%)
        </label>

        <label class="checkbox-label">
            <input type="checkbox" id="toggleSpaghetti" checked py-change="update_dashboard">
            Ensemble Member Tracks
        </label>

        <label class="checkbox-label">
            <input type="checkbox" id="toggleMean" checked py-change="update_dashboard">
            Ensemble Mean & Track Markers
        </label>
    </div>

    <!-- Legend -->
    <div class="legend">
        <span>Strike Probability Scale (150 km Radius, Scaled 100%)</span>
        <div class="legend-bar"></div>
        <div class="legend-labels">
            <span>10%</span>
            <span>50%</span>
            <span>100%</span>
        </div>
    </div>
</div>

<div id="map"></div>

<script type="py">
import numpy as np
from scipy.stats import gaussian_kde
from js import document, L
from pyodide.ffi import to_js

FIXED_RADIUS_KM = 150.0

# Latest Invest 95W Position & Forecast Mean
storm_data = {
    "name": "Invest 95W",
    "id": "95W",
    "lat": 19.5, "lon": 116.8,  # SCS / SE of Hong Kong Basin position
    "observed": [[18.2, 118.5], [18.9, 117.6], [19.5, 116.8]],
    "forecast_mean": [[19.5, 116.8], [20.2, 115.8], [21.0, 114.7], [21.8, 113.5], [22.4, 112.1]],
    "seeds": {"gefs": 9511, "eceps": 7789, "cmeps": 3312},
    "counts": {"gefs": 30, "eceps": 50, "cmeps": 20}
}

def compute_ensemble_coords(model="gefs"):
    seed = storm_data["seeds"][model]
    num_members = storm_data["counts"][model]
    np.random.seed(seed)
    
    mean_coords = np.array(storm_data["forecast_mean"])
    lons = mean_coords[:, 1]
    lats = mean_coords[:, 0]
    
    member_lons, member_lats = [], []
    
    for i in range(num_members):
        lon_noise = np.random.normal(0, 0.3, size=len(lons)).cumsum()
        lat_noise = np.random.normal(0, 0.3, size=len(lats)).cumsum()
        
        m_lon = lons + lon_noise + (i - num_members/2) * 0.06
        m_lat = lats + lat_noise
        
        member_lons.append(m_lon)
        member_lats.append(m_lat)

    return member_lons, member_lats

def get_pixel_radius(lat, radius_km, map_obj):
    meters_per_pixel = 156543.03392 * np.cos(np.radians(lat)) / (2 ** map_obj.getZoom())
    return (radius_km * 1000.0) / meters_per_pixel

map_center = L.latLng(storm_data["lat"], storm_data["lon"])
map_js = L.map('map', to_js({'zoomControl': False})).setView(map_center, 6)

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    'maxZoom': 18,
    'attribution': 'CartoDB'
}).addTo(map_js)

L.control.zoom(to_js({'position': 'topright'})).addTo(map_js)

active_layers = []

def update_dashboard(event=None):
    global active_layers
    
    model_choice = document.getElementById("modelSelect").value
    show_heatmap = document.getElementById("toggleHeatmap").checked
    show_spaghetti = document.getElementById("toggleSpaghetti").checked
    show_mean = document.getElementById("toggleMean").checked

    for layer in active_layers:
        map_js.removeLayer(layer)
    active_layers.clear()

    m_lons, m_lats = compute_ensemble_coords(model=model_choice)

    # 1. Heatmap layer with probability multiplied by 100%
    if show_heatmap:
        pixel_radius = get_pixel_radius(storm_data["lat"], FIXED_RADIUS_KM, map_js)
        
        all_lons_flat = np.concatenate(m_lons)
        all_lats_flat = np.concatenate(m_lats)
        
        values = np.vstack([all_lons_flat, all_lats_flat])
        kernel = gaussian_kde(values)
        
        raw_kde_density = kernel(values)
        # Normalize and multiply color & probability intensity by 100%
        kde_scaled = (raw_kde_density / raw_kde_density.max()) * 100.0
        
        heat_points = []
        for idx in range(len(all_lons_flat)):
            lat_val = all_lats_flat[idx]
            lon_val = all_lons_flat[idx]
            # Multiply color factor by 100% scale
            prob_weight = float(min(kde_scaled[idx], 100.0))
            heat_points.append([lat_val, lon_val, prob_weight])

        heat_layer = L.heatLayer(
            to_js(heat_points),
            to_js({
                'radius': pixel_radius,
                'blur': pixel_radius * 0.6,
                'maxZoom': 10,
                'max': 100.0,
                'gradient': {
                    0.1: '#0000ff',
                    0.3: '#00ffff',
                    0.5: '#00ff00',
                    0.7: '#ffff00',
                    1.0: '#ff0000'
                }
            })
        ).addTo(map_js)
        active_layers.append(heat_layer)

    # 2. Ensemble Lines
    if show_spaghetti:
        for i in range(len(m_lons)):
            pts = [[m_lats[i][j], m_lons[i][j]] for j in range(len(m_lons[i]))]
            line = L.polyline(to_js(pts), to_js({'color': '#c084fc', 'weight': 1.2, 'opacity': 0.4})).addTo(map_js)
            active_layers.append(line)

    # 3. Forecast Track & Mean Line
    if show_mean:
        obs_js = to_js([[c[0], c[1]] for c in storm_data["observed"]])
        obs_line = L.polyline(obs_js, to_js({'color': '#38bdf8', 'weight': 4, 'opacity': 0.9})).addTo(map_js)
        active_layers.append(obs_line)

        fct_js = to_js([[c[0], c[1]] for c in storm_data["forecast_mean"]])
        fct_line = L.polyline(fct_js, to_js({'color': '#f59e0b', 'weight': 4, 'dashArray': '8, 8'})).addTo(map_js)
        active_layers.append(fct_line)

        for idx, pt in enumerate(storm_data["forecast_mean"]):
            marker = L.circleMarker(L.latLng(pt[0], pt[1]), to_js({
                'radius': 7 if idx == 0 else 5,
                'fillColor': '#ef4444' if idx == 0 else '#f59e0b',
                'color': '#ffffff',
                'weight': 1.5,
                'fillOpacity': 0.95
            })).addTo(map_js)
            
            marker.bindPopup(f"""
                <div style="font-size:12px; font-family:sans-serif;">
                    <b>{storm_data['name']} ({model_choice.upper()})</b><br>
                    Forecast Lead: <b>+{idx * 12}h</b><br>
                    Lat: {pt[0]}°N, Lon: {pt[1]}°E
                </div>
            """)
            active_layers.append(marker)

    map_js.flyTo(map_center, 6)

map_js.on('zoomend', to_js(lambda e: update_dashboard()))
update_dashboard()
</script>

</body>
</html>
