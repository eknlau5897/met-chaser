<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PyScript Interactive Direct-Edit Forecast Builder</title>

    <!-- PyScript Core -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- Leaflet JS & CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
        #map { width: 100vw; height: 100vh; background: #0b0f19; cursor: crosshair; }
        
        #control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.92);
            color: #f8fafc;
            padding: 18px;
            border-radius: 12px;
            width: 340px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
        }
        
        .panel-title { 
            font-weight: 700; 
            font-size: 14px; 
            color: #38bdf8; 
            margin-bottom: 12px; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            padding-bottom: 6px; 
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .control-group { margin-bottom: 12px; }
        label { font-size: 12px; color: #94a3b8; font-weight: 600; display: block; margin-bottom: 4px; }
        
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #1e293b;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 6px;
            outline: none;
            box-sizing: border-box;
            font-size: 12px;
        }

        .btn {
            width: 100%;
            background: #0284c7;
            color: #fff;
            padding: 9px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            margin-top: 6px;
            box-sizing: border-box;
        }

        .btn:hover { background: #0369a1; }
        .btn-danger { background: #dc2626; }
        .btn-danger:hover { background: #b91c1c; }

        .hint-box {
            background: rgba(56, 189, 248, 0.1);
            border-left: 3px solid #38bdf8;
            padding: 8px;
            font-size: 11px;
            color: #cbd5e1;
            margin-bottom: 12px;
            border-radius: 0 4px 4px 0;
        }
    </style>

    <py-config>
        packages = ["pandas", "numpy"]
    </py-config>
</head>
<body>

<div id="control-panel">
    <div class="panel-title">
        <span>🌀 DIRECT TRACK BUILDER</span>
        <span style="font-size: 10px; background: #0284c7; padding: 2px 6px; border-radius: 4px;">INTERACTIVE</span>
    </div>

    <div class="hint-box">
        • <b>Click map</b> to append waypoints.<br>
        • <b>Drag points</b> to move coordinates.<br>
        • <b>Click waypoint</b> to delete it.
    </div>

    <!-- Metadata -->
    <div class="control-group">
        <label for="stormName">SYSTEM NAME / ID:</label>
        <input type="text" id="stormName" value="Custom Direct Track" py-change="render_map">
    </div>

    <!-- Actions -->
    <div class="control-group">
        <button class="btn" style="background:#059669;" py-click="export_csv">💾 Export Track to CSV</button>
        <button class="btn btn-danger" py-click="clear_all">🗑️ Clear Track</button>
    </div>
</div>

<div id="map"></div>

<script type="py">
import io
import pandas as pd
import numpy as np
from js import document, L, Blob, URL
from pyodide.ffi import to_js, create_proxy

# Initialize Python Data Structures
waypoints = [
    {"hour": 0, "lat": 18.0, "lon": 120.0, "mslp": 1004.0},
    {"hour": 12, "lat": 18.8, "lon": 118.5, "mslp": 1000.0},
    {"hour": 24, "lat": 19.6, "lon": 117.1, "mslp": 994.0},
    {"hour": 36, "lat": 20.5, "lon": 115.8, "mslp": 988.0},
    {"hour": 48, "lat": 21.3, "lon": 114.5, "mslp": 980.0}
]

# Initialize Leaflet Map
map_js = L.map('map', to_js({'zoomControl': False})).setView(L.latLng(19.5, 117.0), 6)

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    'maxZoom': 18,
    'attribution': 'CartoDB'
}).addTo(map_js)

L.control.zoom(to_js({'position': 'topright'})).addTo(map_js)

active_layers = []

def render_map(event=None):
    global active_layers, waypoints
    
    # Clear existing map layers
    for layer in active_layers:
        map_js.removeLayer(layer)
    active_layers.clear()

    if not waypoints:
        return

    storm_title = document.getElementById("stormName").value

    # Re-calculate forecast hours linearly based on sequence
    for idx, wp in enumerate(waypoints):
        wp["hour"] = idx * 12

    # 1. Polyline Vector
    coords = [[wp["lat"], wp["lon"]] for wp in waypoints]
    polyline = L.polyline(to_js(coords), to_js({
        'color': '#38bdf8',
        'weight': 3,
        'dashArray': '6, 6',
        'opacity': 0.85
    })).addTo(map_js)
    active_layers.append(polyline)

    # 2. Interactive Markers
    for idx, wp in enumerate(waypoints):
        marker = L.marker(L.latLng(wp["lat"], wp["lon"]), to_js({
            'draggable': True
        })).addTo(map_js)

        # Popup Info
        marker.bindPopup(f"""
            <div style="font-size:12px; font-family:sans-serif;">
                <b>{storm_title}</b><br>
                Hour: <b>+{wp['hour']}h</b><br>
                Pos: <b>{wp['lat']:.2f}°N, {wp['lon']:.2f}°E</b><br>
                <i style="color:#94a3b8;">Click marker again to delete</i>
            </div>
        """)

        # Marker Drag Binding
        def make_drag_handler(i):
            def on_drag_end(e):
                latlng = e.target.getLatLng()
                waypoints[i]["lat"] = float(latlng.lat)
                waypoints[i]["lon"] = float(latlng.lng)
                render_map()
            return create_proxy(on_drag_end)

        # Marker Delete Binding (click event)
        def make_click_handler(i):
            def on_click(e):
                waypoints.pop(i)
                render_map()
            return create_proxy(on_click)

        marker.on('dragend', make_drag_handler(idx))
        marker.on('click', make_click_handler(idx))

        active_layers.append(marker)

# Map Click Listener to add new Waypoints dynamically
def on_map_click(e):
    lat = float(e.latlng.lat)
    lon = float(e.latlng.lng)
    
    waypoints.append({
        "hour": len(waypoints) * 12,
        "lat": lat,
        "lon": lon,
        "mslp": 1000.0
    })
    render_map()

map_js.on('click', create_proxy(on_map_click))

def clear_all(event=None):
    global waypoints
    waypoints = []
    render_map()

def export_csv(event=None):
    df = pd.DataFrame(waypoints)
    csv_str = df.to_csv(index=False)
    blob = Blob.new([csv_str], to_js({'type': 'text/csv'}))
    url = URL.createObjectURL(blob)
    
    a = document.createElement('a')
    a.href = url
    a.download = f"custom_track.csv"
    a.click()

# Initial render
render_map()
</script>

</body>
</html>
